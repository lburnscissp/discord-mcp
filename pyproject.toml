[project]
name = "discord-mcp"
version = "0.1.0"
description = "MCP server that lets an LLM operate a Discord bot: read, post, manage channels and roles, moderate."
readme = "README.md"
authors = [
    { name = "divergentfreq", email = "everythingxelle@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.10",
    "python-dotenv>=1.0",
]

[project.scripts]
discord-mcp = "discord_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
