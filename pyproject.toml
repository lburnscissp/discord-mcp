[project]
name = "discord-mcp"
version = "0.1.0"
description = "MCP server that lets an LLM operate a Discord bot: read, post, manage channels and roles, moderate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "discord", "discord-bot", "claude", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "divergentfreq", email = "everythingxelle@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.10",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/lburnscissp/discord-mcp"
Repository = "https://github.com/lburnscissp/discord-mcp"
Issues = "https://github.com/lburnscissp/discord-mcp/issues"

# Mirrors [dependency-groups].dev so `pip install -e ".[dev]"` works for people not using uv.
[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "respx>=0.23.1"]

[project.scripts]
discord-mcp = "discord_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
